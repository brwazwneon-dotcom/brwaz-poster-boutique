<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Premium white BRW frame on dark charcoal wall with quote poster">
  <defs>
    <radialGradient id="light" cx="50%" cy="31%" r="62%">
      <stop offset="0%" stop-color="#55575a"/>
      <stop offset="38%" stop-color="#27292c"/>
      <stop offset="100%" stop-color="#101113"/>
    </radialGradient>
    <filter id="wallNoise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="4" seed="19"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.10"/>
      </feComponentTransfer>
    </filter>
    <filter id="frameShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="36" stdDeviation="32" flood-color="#000000" flood-opacity="0.48"/>
      <feDropShadow dx="18" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="frameFace" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="46%" stop-color="#f7f4ed"/>
      <stop offset="100%" stop-color="#ded8cc"/>
    </linearGradient>
    <linearGradient id="frameSide" x1="0" x2="1">
      <stop offset="0%" stop-color="#cfc8bc"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="38%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="64%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#light)"/>
  <rect width="1600" height="900" filter="url(#wallNoise)" opacity="0.86"/>
  <path d="M0 0h1600v900H0z" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="3"/>
  <ellipse cx="800" cy="820" rx="420" ry="48" fill="#000000" opacity="0.22"/>

  <g filter="url(#frameShadow)">
    <path d="M508 148h604l36 28v548l-36 28H508l-36-28V176z" fill="#151515" opacity="0.28"/>
    <path d="M486 136h628l44 34v552l-44 34H486l-44-34V170z" fill="url(#frameSide)"/>
    <path d="M516 168h568l34 25v506l-34 25H516l-34-25V193z" fill="url(#frameFace)"/>
    <path d="M548 202h504l24 17v456l-24 17H548l-24-17V219z" fill="#d8d2c5"/>
    <path d="M568 222h464l20 14v420l-20 14H568l-20-14V236z" fill="#ffffff"/>

    <g transform="translate(0 -4)">
      <text x="800" y="363" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" letter-spacing="8" fill="#111111">CREATE</text>
      <text x="800" y="462" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="500" letter-spacing="11" fill="#111111">YOUR OWN</text>
      <text x="800" y="568" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" letter-spacing="8" fill="#111111">LEGEND</text>
      <line x1="695" y1="612" x2="905" y2="612" stroke="#111111" stroke-width="3" opacity="0.78"/>
      <text x="800" y="647" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="7" fill="#111111" opacity="0.64">BRWAZWNEON</text>
    </g>

    <path d="M548 222h504l-504 292z" fill="url(#glass)" opacity="0.55"/>
    <path d="M612 222h88L548 318v-70z" fill="#ffffff" opacity="0.22"/>
    <path d="M486 136h628l44 34v552l-44 34H486l-44-34V170z" fill="none" stroke="#ffffff" stroke-opacity="0.62" stroke-width="2"/>
    <path d="M548 202h504l24 17v456l-24 17H548l-24-17V219z" fill="none" stroke="#000000" stroke-opacity="0.16" stroke-width="2"/>
  </g>
</svg>
